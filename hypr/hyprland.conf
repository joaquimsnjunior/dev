# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

source = /home/$USER/.cache/wal/colors-hyprland


# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$browser = google-chrome-stable
$menu = rofi -show drun -p "Search> " | xargs -I{} search {}
$discord = discord

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper & kbuildsycoca6
exec-once = /usr/lib/polkit-kde-authentication-agent-1

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1

env = XDG_MENU_PREFIX,arch-

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 8, 12, 12, 12

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1


    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        new_optimizations = true
        ignore_opacity = false
        passes = 5
        vibrancy = 0.1696
        special = false
    }
        shadow {
            enabled = false
            range = 10
            render_power = 5
            color = rgba(0,0,0,.5)
    }
    dim_inactive = false
    dim_strength = 0.05
}

xwayland {
    force_zero_scaling = true
}



# https://wiki.hyprland.org/Configuring/Variables/#animations

animations {
    enabled = true

    bezier = default, 0.05, 0.9, 0.1, 1.02
    bezier = wind, 0.05, 0.9, 0.1, 1.02
    bezier = overshot, 0.13, 0.99, 0.29, 1.02
    bezier = liner, 1, 1, 1, 1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1.03

    # Slow Animations
    # animation = windows, 1, 7, wind, popin
    # animation = windowsIn, 1, 6, overshot, popin
    # animation = windowsOut, 1, 5, overshot, popin
    # animation = windowsMove, 1, 6, overshot, slide
    # animation = layers, 1, 4, default, popin
    # animation = fadeIn, 1, 10, default
    # animation = fadeOut, 1, 10, default
    # animation = fadeSwitch, 1, 10, default
    # animation = fadeShadow, 1, 10, default
    # animation = fadeDim, 1, 10, default
    # animation = fadeLayers, 1, 10, default
    # animation = workspaces, 1, 6, overshot, slide
    # animation = border, 1, 1, liner
    # animation = borderangle, 1, 30, liner, loop

    # Fast Animations
    animation = windows, 1, 2, easeOutQuint, popin
    animation = windowsIn, 1, 2, easeOutQuint, popin
    animation = windowsOut, 1, 2, overshot, popin
    animation = windowsMove, 1, 2, overshot, slide
    animation = layers, 1, 2, default, popin
    animation = fadeIn, 1, 2, default
    animation = fadeOut, 1, 2, default
    animation = fadeSwitch, 1, 2, default
    animation = fadeShadow, 1, 2, default
    animation = fadeDim, 1, 2, default
    animation = fadeLayers, 1, 2, default
    animation = workspaces, 1, 2, wind, slidevert
    animation = border, 1, 1, liner
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    focus_on_activate = true
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = br
    kb_options = ctrl:nocaps

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Cursor workaround
cursor {
   no_hardware_cursors = true
}


###################
### KEYBINDINGS ###
###################

env = HYPRSHOT_DIR,$HOME/screenshots
# See https://wiki.hyprland.org/Configuring/Keywords/
bind = SUPER,I,exec,hyprshot -m region
bind = SUPER,S,exec,hyprshot -m region --raw | satty --filename -
bind = SUPER SHIFT,S,exec,hyprshot -m window
bind = SUPER, W, exec, pkill waybar && waybar &


# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, T, exec, $terminal
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, M, exit,
bind = SUPER, E, exec, $fileManager
bind = SUPER, V, togglefloating,
bind = SUPER, space, exec, $menu
bind = SUPER, F, fullscreen
bind = SUPER, B, exec, $browser
bind = SUPER, D, exec, $discord
bind = SUPER, L, exec, hyprlock
bind = SUPER, RETURN, exec, hypremoji

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

#FIX: Removed redundant 'ignore_alpha 0' lines — each namespace had both
# 'ignore_alpha 0' and 'ignore_alpha 0.5' applied, with the 0.5 always
# overriding the 0. Kept only the intended 0.5 value for each.

layerrule = no_anim on, match:namespace selection
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

gesture = 3, horizontal, workspace

# HyprEmoji config
source = ~/.config/hypremoji/hypremoji.conf
